services:
  mcp-weather:
    build:
      context: .
      target: runtime
    container_name: mcp-weather-server
    env_file:
      - .env
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - DEFAULT_UNITS=${DEFAULT_UNITS:-metric}
    restart: unless-stopped
    stdin_open: true
    tty: true
